name: release

# Релиз по тегу: git tag v0.1-mvp && git push origin v0.1-mvp
# Заметки к релизу собираются из названий слитых PR (разделы — .github/release.yml).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - name: Релиз только с зелёными тестами и гейтом качества
        run: |
          pytest -q
          python scripts/eval_gate.py
      - name: Создать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
