name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest httpx ruff
      - name: Стиль
        run: ruff check .
      - name: Тесты, включая сквозной прогон «падение → оповещение» без железа
        run: pytest -q
      - name: Гейт качества (полнота, ложные тревоги, задержка ≤ 4 с)
        run: python scripts/eval_gate.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка образа сервера
        run: docker build -t chronopose:ci .
      - name: Образ запускается и отвечает
        run: |
          docker run -d --name app -p 8000:8000 chronopose:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/health && exit 0; sleep 1; done
          docker logs app; exit 1
