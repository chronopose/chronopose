name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff pytest
      - name: Стиль
        run: ruff check .
      - name: Тесты и прогон «падение → оповещение» по записи
        run: pytest -q
      - name: Гейт качества (полнота, ложные тревоги, задержка ≤ 4 с)
        run: python scripts/eval_gate.py
