name: claim-role

# Роль закрепляется за тем, кто первым закрыл задачу этой роли (строка Task-Done: SCRUM-123 в коммите).
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: claim-role
  cancel-in-progress: false

jobs:
  claim:
    if: "!contains(github.event.head_commit.message, '[roles-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Если main защищена правилами, бот пушит токеном владельца из секрета (см. docs/process.md, раздел 3).
          token: ${{ secrets.ROLES_BOT_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Обновить роли
        run: python scripts/claim_role.py --event "$GITHUB_EVENT_PATH"
      - name: Закоммитить ROLES.md и CODEOWNERS
        run: |
          if git diff --quiet -- ROLES.md .github/roles/roles.json .github/CODEOWNERS; then
            echo "Роли не изменились"; exit 0
          fi
          git config user.name "roles-bot"
          git config user.email "roles-bot@users.noreply.github.com"
          git add ROLES.md .github/roles/roles.json .github/CODEOWNERS
          git commit -m "Обновить ROLES.md [roles-bot]"
          git push
