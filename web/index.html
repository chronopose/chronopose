<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>chronopose — пульт</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@700;800;900&family=Golos+Text:wght@400;500;600;700&family=Martian+Mono:wght@400;500;600&family=Old+Standard+TT:ital@1&display=swap">
<style>
/* Пульт в стиле хронофотографии Маре: бумага, тушь, один оранжевый акцент. Видео — «фотопластинка».
   Один светлый вид: читается на проекторе в светлой аудитории. */
:root { --paper:#EFEBE1; --ink:#0E0E0C; --muted:#55524B; --orange:#F23D00; --rust:#B83000; --blue:#1B2FE0;
  --f-d:'Sofia Sans Extra Condensed','Arial Narrow',Arial,sans-serif; --f-b:'Golos Text',Arial,sans-serif;
  --f-m:'Martian Mono','Courier New',monospace; --f-s:'Old Standard TT',Georgia,serif; color-scheme:light; }
* { box-sizing:border-box }
body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.45 var(--f-b);
  padding-left:max(20px,env(safe-area-inset-left,0px)); padding-right:max(20px,env(safe-area-inset-right,0px)); padding-block:18px 28px; }
header { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:10px 24px; padding-bottom:12px; border-bottom:2px solid var(--ink); margin-bottom:18px }
h1 { font:900 54px/.85 var(--f-d); text-transform:uppercase; margin:0; letter-spacing:-.5px }
h1 span { font:italic 400 30px/1 var(--f-s); text-transform:none; color:var(--rust); letter-spacing:0 }
.chips { display:flex; flex-wrap:wrap; gap:6px 18px; align-items:center }
.chip { display:flex; align-items:center; gap:8px; font:500 12px/1 var(--f-m); letter-spacing:.04em; text-transform:uppercase; color:var(--muted) }
.dot { width:10px; height:10px; border:2px solid var(--ink); background:transparent }
.chip.on { color:var(--ink) } .chip.on .dot { background:var(--ink) }
.chip.off { color:var(--rust) } .chip.off .dot { border-color:var(--orange); background:var(--orange) }
.grid { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:28px; align-items:start }
.card { min-width:0 }
.card h2 { font:500 12px/1 var(--f-m); letter-spacing:.08em; text-transform:uppercase; color:var(--ink); margin:0 0 10px; padding-top:10px; border-top:2px solid var(--ink); display:flex; justify-content:space-between }
.video { position:relative; aspect-ratio:4/3; max-width:100%; background:var(--ink); overflow:hidden; display:grid; place-items:center }
.video img { width:100%; height:100%; object-fit:contain; display:block }
.video .ph { position:absolute; color:var(--paper); font:500 13px var(--f-m) }
.side { display:flex; flex-direction:column; gap:22px; min-width:0 }
#alert { padding:16px 18px 18px; border:2px solid var(--ink) }
#alert .k { font:500 12px/1 var(--f-m); letter-spacing:.08em; text-transform:uppercase; color:var(--muted) }
#alert .txt { font:600 21px/1.3 var(--f-b); margin-top:10px }
#alert .meta { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px }
#alert .tag { font:500 12px/1 var(--f-m); padding:6px 8px; border:1.5px solid var(--ink) }
#alert.active { background:var(--orange) } #alert.active .k { color:var(--ink) }
@media (prefers-reduced-motion:no-preference) { #alert.pulse { animation:pulse .5s steps(2) 6 } }
@keyframes pulse { 50% { background:var(--paper) } }
.ack { all:unset; cursor:pointer; margin-top:14px; font:500 13px var(--f-m); text-transform:uppercase; letter-spacing:.06em; padding:10px 14px; background:var(--ink); color:var(--paper) }
.ack:focus-visible { outline:2px solid var(--blue); outline-offset:2px }
.person { display:grid; grid-template-columns:auto 1fr auto; gap:6px 12px; align-items:baseline; padding:10px 0; border-top:1px solid var(--ink) }
.person:first-of-type { border-top:none; padding-top:0 }
.pid { font:800 30px/1 var(--f-d) }
.act { font:800 26px/1 var(--f-d); text-transform:uppercase; justify-self:end }
.act.fall { color:var(--orange); -webkit-text-stroke:.6px var(--ink) } .act.lie { color:var(--rust) }
.bar { grid-column:1/-1; height:8px; border:1.5px solid var(--ink) }
.bar i { display:block; height:100%; background:var(--orange); transition:width .3s }
.small { font:400 12px var(--f-m); color:var(--muted) }
.empty { color:var(--muted); padding:6px 0 }
.log { overflow-x:auto; margin-top:26px }
table { width:100%; border-collapse:collapse; font-size:15px; font-variant-numeric:tabular-nums }
th { text-align:left; font:500 11px/1 var(--f-m); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:8px 10px 8px 0; border-bottom:2px solid var(--ink) }
td { padding:10px 10px 10px 0; border-bottom:1px solid var(--ink); vertical-align:top }
tr.new td:first-child { box-shadow:inset 4px 0 0 var(--orange); padding-left:12px }
.btn { all:unset; cursor:pointer; font:500 12px var(--f-m); text-transform:uppercase; letter-spacing:.04em; color:var(--ink); border:1.5px solid var(--ink); padding:6px 10px }
.btn:hover, .btn:focus-visible { background:var(--ink); color:var(--paper) }
@media (max-width:900px) { .grid { grid-template-columns:1fr } h1 { font-size:40px } }
</style>
</head>
<body>
<header>
  <h1>chronopose <span>пульт оператора</span></h1>
  <div class="chips" aria-live="polite">
    <span class="chip" id="c-cam"><i class="dot"></i><span>Камера</span></span>
    <span class="chip" id="c-imu"><i class="dot"></i><span>Датчик</span></span>
    <span class="chip" id="c-esp"><i class="dot"></i><span>ESP32</span></span>
    <span class="chip" id="c-ws"><i class="dot"></i><span>Связь</span></span>
    <button class="btn" id="sound" type="button">Звук: выкл</button>
  </div>
</header>

<div class="grid">
  <section class="card" aria-label="Видео">
    <h2><span>Камера <span id="cam-id">cam_01</span></span><span id="fps">— к/с</span></h2>
    <div class="video"><span class="ph" id="ph">Ждём кадры…</span><img id="stream" alt="Видео с камеры со скелетами людей"></div>
  </section>
  <div class="side">
    <section id="alert" aria-live="assertive">
      <div class="k" id="alert-k">Тревог нет</div>
      <div class="txt" id="alert-txt">Система наблюдает. Оповещение появится здесь меньше чем через 4 секунды после падения.</div>
      <div class="meta" id="alert-meta"></div>
      <button class="ack" id="ack" type="button" hidden>Принято</button>
    </section>
    <section class="card" aria-label="Люди в кадре">
      <h2><span>Люди в кадре</span><span id="n-people">0</span></h2>
      <div id="people"><div class="empty">Никого не видно</div></div>
    </section>
  </div>
</div>

<section class="card log" aria-label="Журнал событий">
  <h2><span>Журнал событий</span><span id="n-events">0</span></h2>
  <table>
    <thead><tr><th>Время</th><th>Кто</th><th>Где</th><th>Видео</th><th>Датчик</th><th>Оповещение</th></tr></thead>
    <tbody id="events"><tr><td colspan="6" class="empty">Событий пока нет</td></tr></tbody>
  </table>
</section>

<script>
const $ = (id) => document.getElementById(id);
const ACT = { stand: "стоит", walk: "идёт", fall: "падает", lie: "лежит" };
const IMU = { true: "подтвердил удар", false: "удара нет", null: "нет данных" };
const STATE = { NORMAL: "норма", SUSPECTED: "подозрение", ALERT_SENT: "тревога отправлена" };
const fmt = (t) => new Date(t * 1000).toLocaleTimeString("ru-RU");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let camId = "cam_01", sound = false, audio = null, seen = new Set();

function chip(id, on, label) { const c = $(id); c.className = "chip " + (on === null ? "" : on ? "on" : "off"); if (label) c.lastElementChild.textContent = label; }

async function poll() {
  try {
    const [cams, people, sensors] = await Promise.all(["/api/cameras", "/api/people", "/api/sensors"].map((u) => fetch(u).then((r) => r.json())));
    const cam = cams[0];
    if (cam) {
      if (cam.id !== camId || !$("stream").src) { camId = cam.id; $("cam-id").textContent = camId; $("stream").src = `/api/cameras/${camId}/stream`; }
      chip("c-cam", cam.connected, cam.source === "synthetic" ? "Камера · синтетика" : "Камера");
      $("fps").textContent = `${cam.fps.toFixed(1)} к/с`;
    }
    const imu = sensors.imu[0];
    chip("c-imu", imu ? imu.online : false, imu ? `Датчик · ${imu.rate_hz} Гц` : "Датчик · нет");
    const esp = sensors.actuators[0];
    chip("c-esp", esp ? !!esp.online : null, esp ? "ESP32" : "ESP32 · нет данных");
    $("n-people").textContent = people.length;
    $("people").innerHTML = people.length ? people.map((p) => {
      const pf = (p.probs.fall || 0) * 100;
      const hit = p.fused && p.fused.imu_peak && (p.action === "fall" || p.action === "lie");
      return `<div class="person"><span class="pid">${esc(p.person)}</span><span class="small">${hit ? "удар по датчику" : (STATE[p.state] || esc(p.state))}</span>
        <span class="act ${esc(p.action)}">${ACT[p.action] || esc(p.action)}</span>
        <div class="bar" title="Вероятность падения ${pf.toFixed(0)} %"><i style="width:${pf}%"></i></div></div>`;
    }).join("") : '<div class="empty">Никого не видно</div>';
  } catch (e) { chip("c-cam", false); }
}

async function loadEvents() {
  const rows = await fetch("/api/events?limit=30").then((r) => r.json()).catch(() => []);
  $("n-events").textContent = rows.length;
  $("events").innerHTML = rows.length ? rows.map((e) => `<tr class="${seen.has(e.id) ? "" : "new"}"><td>${fmt(e.t_start)}</td><td>${esc(e.person)}</td>
    <td>${esc(e.camera_id)} · зона ${esc(e.zone)}</td><td>${Math.round(e.confidence * 100)} %</td><td>${IMU[e.imu_confirmed]}</td><td>${esc(e.text)}</td></tr>`).join("")
    : '<tr><td colspan="6" class="empty">Событий пока нет</td></tr>';
  rows.forEach((e) => seen.add(e.id));
}

function showAlert(a) {
  const box = $("alert");
  box.className = "active pulse";
  $("alert-k").textContent = `Тревога · ${fmt(a.t)}`;
  $("alert-txt").textContent = a.text;
  $("alert-meta").innerHTML = [`${esc(a.person)}`, `${esc(a.camera_id)} · зона ${esc(a.zone)}`, `видео ${Math.round(a.confidence * 100)} %`, `датчик: ${IMU[a.imu_confirmed]}`]
    .map((t) => `<span class="tag">${t}</span>`).join("");
  $("ack").hidden = false;
  if (sound) beep();
  loadEvents();
}
$("ack").onclick = () => { $("alert").className = ""; $("alert-k").textContent = "Тревог нет"; $("alert-txt").textContent = "Оповещение принято. Система продолжает наблюдение."; $("alert-meta").innerHTML = ""; $("ack").hidden = true; };

function beep() {
  try { audio = audio || new AudioContext(); const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = 880; g.gain.value = 0.12;
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + 0.5); } catch (e) {}
}
$("sound").onclick = () => { sound = !sound; $("sound").textContent = `Звук: ${sound ? "вкл" : "выкл"}`; if (sound) beep(); };

function connect() {
  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/events");
  ws.onopen = () => chip("c-ws", true, "Связь");
  ws.onmessage = (m) => { const d = JSON.parse(m.data); if (d.type === "alert") showAlert(d.alert); };
  ws.onclose = () => { chip("c-ws", false, "Связь · переподключение"); setTimeout(connect, 1500); };
}
$("stream").onload = () => { $("ph").hidden = true; };
connect(); poll(); loadEvents(); setInterval(poll, 700); setInterval(loadEvents, 5000);
</script>
</body>
</html>
